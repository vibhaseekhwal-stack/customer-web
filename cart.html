<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cart - CD Shopping Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="js/tailwind-config.js"></script>
<style>
  body { font-family: 'Karla', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen pb-[140px]">
<header class="flex items-center px-container-margin h-tap-target sticky top-0 z-50 bg-surface shadow-sm">
  <button class="w-tap-target h-tap-target -ml-sm flex items-center justify-center" onclick="window.location.href='home.html'">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <h1 class="font-headline-sm text-headline-sm font-bold text-primary">Cart</h1>
</header>

<main class="max-w-2xl mx-auto px-container-margin py-lg space-y-lg">
  <div id="cartItems" class="space-y-md"></div>
  <div class="hidden text-center py-xl" id="emptyCart">
    <span class="material-symbols-outlined text-[48px] text-on-surface-variant">shopping_cart</span>
    <p class="font-body-md text-body-md text-on-surface-variant mt-sm">Your cart is empty.</p>
    <a class="inline-block mt-md px-lg py-sm bg-primary text-on-primary rounded-lg font-label-lg text-label-lg" href="home.html">Start Shopping</a>
  </div>

  <section class="hidden bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.04)]" id="billSummary">
    <h2 class="font-headline-sm text-headline-sm mb-sm">Bill Summary</h2>
    <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
      <span>Item Total</span>
      <span id="subtotalDisplay">₹0</span>
    </div>
    <p class="font-body-sm text-body-sm text-on-surface-variant italic mt-xs">Delivery fee (if any) is calculated at checkout, based on delivery or pickup.</p>
  </section>
</main>

<div class="fixed bottom-0 w-full bg-surface/95 backdrop-blur-md p-container-margin hidden" id="checkoutBar">
  <div class="max-w-2xl mx-auto">
    <button class="w-full h-[52px] bg-primary text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-between px-md" id="checkoutBtn">
      <span id="checkoutTotal"></span>
      <span class="flex items-center gap-xs">Proceed to Checkout <span class="material-symbols-outlined">chevron_right</span></span>
    </button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
