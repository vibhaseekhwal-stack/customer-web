<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Order Confirmation - CD Shopping Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="js/tailwind-config.js"></script>
<style>
  body { font-family: 'Karla', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen pb-xl">

<main class="max-w-2xl mx-auto p-container-margin" id="content">
  <div class="text-center text-on-surface-variant py-xl">Loading…</div>
</main>

<template id="template">
  <div class="flex flex-col items-center text-center py-lg">
    <span class="material-symbols-outlined text-[64px] text-primary" id="statusIcon">check_circle</span>
    <h1 class="font-headline-md text-headline-md font-bold mt-md" id="statusHeading">Order Placed!</h1>
    <p class="font-body-md text-body-md text-on-surface-variant mt-xs" id="statusSubtext">Order #<span id="orderNumber"></span></p>
  </div>

  <div class="hidden bg-error-container text-on-error-container text-body-sm rounded-lg p-md mb-lg space-y-sm" id="paymentBox">
    <p id="paymentMessage"></p>
    <button class="w-full h-11 bg-primary text-on-primary rounded-lg font-label-lg text-label-lg" id="payNowBtn">Pay Now</button>
  </div>

  <section class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.04)] space-y-sm mb-lg">
    <h2 class="font-headline-sm text-headline-sm mb-sm">Items</h2>
    <div id="itemsList" class="space-y-sm"></div>
  </section>

  <section class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.04)] space-y-xs mb-lg" id="fulfillmentBox">
    <h2 class="font-headline-sm text-headline-sm mb-sm">Fulfillment</h2>
    <p class="font-body-sm text-body-sm" id="fulfillmentMethodLine"></p>
    <p class="font-body-sm text-body-sm text-on-surface-variant" id="addressLine"></p>
    <p class="font-body-sm text-body-sm text-on-surface-variant" id="paymentMethodLine"></p>
  </section>

  <section class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.04)] space-y-sm mb-xl">
    <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
      <span>Items</span>
      <span id="summarySubtotal">₹0</span>
    </div>
    <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
      <span>Delivery Fee</span>
      <span id="summaryDeliveryFee">₹0</span>
    </div>
    <div class="h-px bg-outline-variant w-full my-sm"></div>
    <div class="flex justify-between items-center">
      <span class="font-headline-sm text-headline-sm">Total</span>
      <span class="font-price-lg text-price-lg text-primary" id="summaryTotal">₹0</span>
    </div>
  </section>

  <div class="flex gap-md">
    <a class="flex-1 text-center py-sm border border-primary text-primary rounded-lg font-label-lg text-label-lg" id="viewOrderLink">View Order</a>
    <a class="flex-1 text-center py-sm bg-primary text-on-primary rounded-lg font-label-lg text-label-lg" href="home.html">Continue Shopping</a>
  </div>
</template>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/confirmation.js"></script>
</body>
</html>
