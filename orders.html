<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Order History - CD Shopping Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="js/tailwind-config.js"></script>
<style>
  body { font-family: 'Karla', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pb-24">
<header class="bg-surface shadow-sm sticky top-0 z-50 flex items-center px-container-margin h-tap-target">
  <h1 class="font-headline-md text-headline-md font-bold text-primary">Order History</h1>
</header>

<main class="flex-1 max-w-2xl w-full mx-auto p-container-margin space-y-md" id="ordersList">
  <div class="text-center text-on-surface-variant py-xl">Loading…</div>
</main>

<div class="hidden text-center py-xl px-container-margin" id="emptyState">
  <span class="material-symbols-outlined text-[48px] text-on-surface-variant">receipt_long</span>
  <p class="font-body-md text-body-md text-on-surface-variant mt-sm">No orders yet.</p>
  <a class="inline-block mt-md px-lg py-sm bg-primary text-on-primary rounded-lg font-label-lg text-label-lg" href="home.html">Start Shopping</a>
</div>

<template id="orderCardTemplate">
  <div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.04)] space-y-sm">
    <div class="flex justify-between items-start">
      <div>
        <h3 class="font-label-lg text-label-lg font-semibold">Order #<span class="order-number"></span></h3>
        <p class="font-body-sm text-body-sm text-on-surface-variant order-date"></p>
      </div>
      <span class="status-badge px-sm py-xs rounded-full font-label-lg text-label-lg text-[11px]"></span>
    </div>
    <p class="font-body-sm text-body-sm text-on-surface-variant order-items-summary"></p>
    <div class="flex justify-between items-center pt-xs">
      <span class="font-price-lg text-price-lg text-primary order-total"></span>
      <div class="flex gap-sm">
        <button class="reorder-btn px-md py-xs border border-primary text-primary rounded-lg font-label-lg text-label-lg text-[12px]">Reorder</button>
        <button class="track-btn px-md py-xs bg-primary text-on-primary rounded-lg font-label-lg text-label-lg text-[12px]">Track</button>
      </div>
    </div>
  </div>
</template>

<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface border-t border-outline-variant shadow-[0px_-4px_12px_rgba(0,0,0,0.04)]">
  <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1" href="home.html">
    <span class="material-symbols-outlined">home</span>
    <span class="font-label-lg text-label-lg text-[10px]">Home</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 relative" href="cart.html">
    <span class="material-symbols-outlined">shopping_cart</span>
    <span class="font-label-lg text-label-lg text-[10px]">Cart</span>
    <span class="hidden absolute top-0 right-1 bg-error text-on-error text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center" id="cartBadge"></span>
  </a>
  <a class="flex flex-col items-center justify-center bg-primary-container text-white rounded-full px-4 py-1" href="orders.html">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
    <span class="font-label-lg text-label-lg text-[10px]">Orders</span>
  </a>
  <a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1" href="account.html">
    <span class="material-symbols-outlined">person</span>
    <span class="font-label-lg text-label-lg text-[10px]">Account</span>
  </a>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
