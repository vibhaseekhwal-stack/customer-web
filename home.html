<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CD Shopping Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="js/tailwind-config.js"></script>
<style>
  body { font-family: 'Karla', sans-serif; }
  .font-display { font-family: 'Baloo 2', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="bg-paper text-ink antialiased min-h-screen flex flex-col pb-24">
<header class="bg-surface-container-lowest shadow-sm sticky top-0 z-50">
  <div class="max-w-2xl mx-auto">
    <div class="flex justify-between items-center w-full px-container-margin h-12">
      <h1 class="font-display text-[20px] font-bold text-primary">CD Shopping Hub</h1>
      <button class="flex items-center justify-center w-9 h-9 text-ink-soft rounded-full" id="logoutBtn">
        <span class="material-symbols-outlined text-[20px]">logout</span>
      </button>
    </div>
    <div class="px-container-margin pb-sm">
      <div class="flex items-center bg-surface-container rounded-full px-md h-10">
        <span class="material-symbols-outlined text-ink-soft text-[18px]">search</span>
        <input class="flex-1 bg-transparent border-none outline-none px-sm text-[14px]" id="searchInput" placeholder="Search for atta, rice, milk…" type="text"/>
      </div>
    </div>
    <div class="flex gap-md overflow-x-auto no-scrollbar px-container-margin pb-sm" id="categoryGrid"></div>
  </div>
</header>

<main class="flex-1 w-full" id="mainContentOuter">
  <div class="max-w-2xl mx-auto px-container-margin py-md" id="mainContent">
    <div class="text-center text-ink-soft text-body-sm py-xl" id="loadingState">Loading…</div>
  </div>
</main>

<template id="sectionTemplate">
  <section class="mb-lg">
    <div class="flex justify-between items-center mb-sm">
      <h2 class="font-display text-[16px] font-bold section-title"></h2>
      <button class="text-primary text-[12px] font-bold see-all-btn">see all &rsaquo;</button>
    </div>
    <div class="flex gap-sm overflow-x-auto no-scrollbar pb-xs section-row"></div>
  </section>
</template>

<template id="cardTemplate">
  <div class="bg-surface-container-lowest rounded-lg border border-outline-variant/40 overflow-hidden flex flex-col cursor-pointer h-full product-card">
    <div class="aspect-square flex items-center justify-center relative media-slot"></div>
    <div class="p-xs flex flex-col gap-0.5 flex-1">
      <p class="text-[12px] font-semibold text-ink leading-tight line-clamp-2 h-[30px] name-slot"></p>
      <p class="text-[10px] text-ink-soft weight-slot"></p>
      <div class="mt-auto flex items-end justify-between gap-1 pt-1">
        <div class="flex flex-col leading-none price-slot"></div>
        <div class="action-slot flex-shrink-0"></div>
      </div>
    </div>
  </div>
</template>

<nav class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant shadow-[0px_-4px_12px_rgba(0,0,0,0.04)]">
  <div class="max-w-2xl mx-auto flex justify-around items-center px-4 py-2">
    <a class="flex flex-col items-center justify-center bg-primary-container text-white rounded-full px-4 py-1" href="home.html">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
      <span class="text-label-lg text-[10px]">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-ink-soft px-4 py-1 relative" href="cart.html">
      <span class="material-symbols-outlined">shopping_cart</span>
      <span class="text-label-lg text-[10px]">Cart</span>
      <span class="hidden absolute top-0 right-1 bg-accent text-on-accent text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center" id="cartBadge"></span>
    </a>
    <a class="flex flex-col items-center justify-center text-ink-soft px-4 py-1" href="orders.html">
      <span class="material-symbols-outlined">receipt_long</span>
      <span class="text-label-lg text-[10px]">Orders</span>
    </a>
    <a class="flex flex-col items-center justify-center text-ink-soft px-4 py-1" href="account.html">
      <span class="material-symbols-outlined">person</span>
      <span class="text-label-lg text-[10px]">Account</span>
    </a>
  </div>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/home.js"></script>
</body>
</html>
