<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Checkout - CD Shopping Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="js/tailwind-config.js"></script>
<style>
  body { font-family: 'Karla', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased pb-32">
<header class="bg-surface shadow-sm flex items-center px-container-margin h-tap-target sticky top-0 z-50">
  <button class="w-tap-target h-tap-target -ml-sm flex items-center justify-center" onclick="window.location.href='cart.html'">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <h1 class="font-headline-sm text-headline-sm font-bold text-primary">Checkout</h1>
</header>

<main class="max-w-2xl mx-auto p-container-margin space-y-xl mt-md">
  <section class="space-y-gutter">
    <h2 class="font-headline-sm text-headline-sm">1. Fulfillment</h2>
    <div class="grid grid-cols-2 gap-gutter">
      <button class="fulfillment-option border-2 rounded-xl p-md flex flex-col items-center text-center" data-method="DELIVERY" id="deliveryOption">
        <span class="material-symbols-outlined mb-sm text-[32px]">local_shipping</span>
        <span class="font-label-lg text-label-lg">Home Delivery</span>
      </button>
      <button class="fulfillment-option border-2 rounded-xl p-md flex flex-col items-center text-center" data-method="PICKUP" id="pickupOption">
        <span class="material-symbols-outlined mb-sm text-[32px]">storefront</span>
        <span class="font-label-lg text-label-lg">Store Pickup</span>
      </button>
    </div>
  </section>

  <section class="space-y-gutter" id="addressSection">
    <div class="flex justify-between items-center">
      <h2 class="font-headline-sm text-headline-sm">2. Delivery Address</h2>
      <button class="text-primary font-label-lg text-label-lg flex items-center gap-xs" id="addAddressBtn">
        <span class="material-symbols-outlined text-[18px]">add</span> Add New
      </button>
    </div>
    <div id="addressList" class="space-y-sm"></div>
    <p class="text-on-surface-variant font-body-sm text-body-sm hidden" id="noAddressMsg">No saved addresses yet — add one to continue.</p>
  </section>

  <section class="space-y-gutter">
    <h2 class="font-headline-sm text-headline-sm">3. Payment Method</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter">
      <button class="payment-option border-2 rounded-xl p-md flex items-center gap-sm text-left" data-method="UPI" id="upiOption">
        <span class="material-symbols-outlined text-[28px]">qr_code_scanner</span>
        <span class="font-label-lg text-label-lg">UPI (GPay, PhonePe, Paytm)</span>
      </button>
      <button class="payment-option border-2 rounded-xl p-md flex items-center gap-sm text-left" data-method="CASH" id="cashOption">
        <span class="material-symbols-outlined text-[28px]">payments</span>
        <span class="font-label-lg text-label-lg" id="cashLabel">Cash</span>
      </button>
    </div>
  </section>

  <section class="bg-surface-container-low rounded-xl p-md space-y-sm">
    <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
      <span>Items</span>
      <span id="summarySubtotal">₹0</span>
    </div>
    <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
      <span>Delivery Fee</span>
      <span id="summaryDeliveryFee">₹0</span>
    </div>
    <div class="h-px bg-outline-variant w-full my-sm"></div>
    <div class="flex justify-between items-center">
      <span class="font-headline-sm text-headline-sm">Total</span>
      <span class="font-price-lg text-price-lg text-primary" id="summaryTotal">₹0</span>
    </div>
  </section>

  <div id="errorBox" class="hidden bg-error-container text-on-error-container text-body-sm rounded-lg p-sm"></div>
</main>

<div class="fixed bottom-0 w-full bg-surface shadow-[0px_-8px_24px_rgba(0,0,0,0.08)] px-container-margin py-md">
  <div class="max-w-2xl mx-auto">
    <button class="w-full bg-primary text-on-primary h-[52px] rounded-full font-label-lg text-label-lg flex items-center justify-center gap-sm" id="placeOrderBtn">
      Place Order <span class="material-symbols-outlined">arrow_forward</span>
    </button>
  </div>
</div>

<!-- Add Address Modal -->
<div class="fixed inset-0 bg-black/40 hidden items-start justify-center p-container-margin overflow-y-auto z-50" id="addressModalBackdrop">
  <div class="bg-surface-container-lowest rounded-xl max-w-md w-full p-lg mt-xl">
    <h3 class="font-headline-sm text-headline-sm mb-md">Add Address</h3>
    <form class="space-y-sm" id="addressForm">
      <input class="w-full border border-outline-variant rounded-lg px-md py-sm" name="label" placeholder="Label (e.g. Home, Work)" type="text"/>
      <input class="w-full border border-outline-variant rounded-lg px-md py-sm" name="line1" placeholder="House / Flat, Street" required="" type="text"/>
      <input class="w-full border border-outline-variant rounded-lg px-md py-sm" name="line2" placeholder="Landmark (optional)" type="text"/>
      <input class="w-full border border-outline-variant rounded-lg px-md py-sm" name="city" placeholder="City" required="" type="text"/>
      <input class="w-full border border-outline-variant rounded-lg px-md py-sm" name="state" placeholder="State" required="" type="text"/>
      <input class="w-full border border-outline-variant rounded-lg px-md py-sm" name="pincode" placeholder="Pincode" required="" type="text"/>
      <div class="flex gap-sm mt-md">
        <button class="flex-1 py-sm border border-outline-variant rounded-lg" id="cancelAddressBtn" type="button">Cancel</button>
        <button class="flex-1 py-sm bg-primary text-on-primary rounded-lg" type="submit">Save Address</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
