<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Order Details - CD Shopping Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="js/tailwind-config.js"></script>
<style>
  body { font-family: 'Karla', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen pb-xl">
<header class="bg-surface shadow-sm sticky top-0 z-50 flex items-center px-container-margin h-tap-target">
  <button class="w-tap-target h-tap-target -ml-sm flex items-center justify-center" onclick="window.location.href='orders.html'">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <h1 class="font-headline-sm text-headline-sm font-bold text-primary">Order Details</h1>
</header>

<main class="max-w-2xl mx-auto p-container-margin" id="content">
  <div class="text-center text-on-surface-variant py-xl">Loading…</div>
</main>

<template id="template">
  <div class="space-y-lg">
    <div class="flex justify-between items-start">
      <div>
        <h2 class="font-headline-sm text-headline-sm">Order #<span id="orderNumber"></span></h2>
        <p class="font-body-sm text-body-sm text-on-surface-variant" id="orderDate"></p>
      </div>
      <span class="status-badge px-sm py-xs rounded-full font-label-lg text-label-lg text-[11px]" id="statusBadge"></span>
    </div>

    <section class="space-y-sm" id="timeline"></section>

    <section class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.04)] space-y-sm">
      <h3 class="font-label-lg text-label-lg text-on-surface-variant">Items</h3>
      <div id="itemsList" class="space-y-sm"></div>
      <div class="h-px bg-outline-variant w-full my-sm"></div>
      <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
        <span>Items</span>
        <span id="summarySubtotal"></span>
      </div>
      <div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
        <span>Delivery Fee</span>
        <span id="summaryDeliveryFee"></span>
      </div>
      <div class="flex justify-between items-center pt-xs">
        <span class="font-headline-sm text-headline-sm">Total</span>
        <span class="font-price-lg text-price-lg text-primary" id="summaryTotal"></span>
      </div>
    </section>

    <section class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.04)] space-y-xs">
      <h3 class="font-label-lg text-label-lg text-on-surface-variant">Fulfillment</h3>
      <p class="font-body-sm text-body-sm" id="fulfillmentLine"></p>
      <p class="font-body-sm text-body-sm text-on-surface-variant" id="addressLine"></p>
      <p class="font-body-sm text-body-sm text-on-surface-variant" id="paymentLine"></p>
    </section>

    <div class="hidden bg-surface-container-lowest rounded-xl p-md" id="cancelSection">
      <button class="w-full py-sm border border-error text-error rounded-lg font-label-lg text-label-lg" id="cancelBtn">Cancel Order</button>
    </div>
  </div>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/order-detail.js"></script>
</body>
</html>
